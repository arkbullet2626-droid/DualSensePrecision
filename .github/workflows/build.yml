# Builds Dual Precision on GitHub's Windows machines and publishes the Setup.exe.
# Every push to main: run tests -> publish (Release, self-contained) -> Inno Setup -> GitHub Release "v<version>".
# The version comes from Directory.Build.props; pushing again with the same version replaces that release's exe.
name: Build Setup.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Make sure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress }

      - name: Test, publish and build the installer
        shell: pwsh
        run: ./build-installer.ps1 -NoExplorer

      - name: Keep the Setup.exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualPrecision-setup
          path: installer/Output/DualPrecision-*-setup.exe
          if-no-files-found: error

      # Release gate: install the Setup.exe the way a user would and check it really worked.
      # (HidHide isn't tested here: its installer is interactive by design - see installer/DualSensePrecision.iss.)
      - name: Install test (app + VIIPER, unattended)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $exe = Get-Item installer/Output/DualPrecision-*-setup.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="viiper"','/LOG="setup.log"' -PassThru
          if (-not $p.WaitForExit(480000)) { Get-Content setup.log -Tail 40; throw "Setup didn't finish within 8 minutes." }
          "setup exit code: $($p.ExitCode)"
          $app = "$env:LOCALAPPDATA\Programs\Dual Precision\DualSensePrecision.exe"
          $viiper = "$env:LOCALAPPDATA\VIIPER\viiper.exe"
          "app installed:    $(Test-Path $app)"
          "VIIPER installed: $(Test-Path $viiper)"
          Start-Sleep 5
          $listening = [bool](Get-NetTCPConnection -LocalPort 3242 -State Listen -ErrorAction SilentlyContinue)
          "VIIPER running:   $listening"
          if ($p.ExitCode -ne 0 -or -not (Test-Path $app) -or -not (Test-Path $viiper)) {
            Get-Content setup.log -Tail 60
            throw "Install test failed - not publishing this build."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-Item installer/Output/DualPrecision-*-setup.exe | Select-Object -First 1
          $version = $exe.Name -replace '^DualPrecision-(.+)-setup\.exe$', '$1'
          $tag = "v$version"
          # Fixed-name copies so https://github.com/<owner>/<repo>/releases/latest/download/DualPrecision-Setup.exe
          # always serves the newest installer (the website's download button never needs changing). The old name
          # (from before the rename to Dual Precision) keeps working for older links and older versions' update banner.
          $stable = Join-Path $exe.DirectoryName 'DualPrecision-Setup.exe'
          Copy-Item $exe.FullName $stable -Force
          $legacy = Join-Path $exe.DirectoryName 'DualSensePrecision-Setup.exe'
          Copy-Item $exe.FullName $legacy -Force
          $sums = Join-Path $exe.DirectoryName 'SHA256SUMS.txt'
          @($exe, (Get-Item $stable), (Get-Item $legacy)) | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content $sums -Encoding ascii
          Get-Content $sums
          # The logo, at a fixed latest/download URL for the website (like Anchor's anchor-logo.png).
          $files = @($exe.FullName, $stable, $legacy, $sums, 'assets/brand/dual-precision-logo.png', 'assets/brand/dual-precision-mark.svg')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            gh release edit $tag --notes-file RELEASE_NOTES.md
          } else {
            gh release create $tag @files --title "Dual Precision $version" --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA --latest
          }
