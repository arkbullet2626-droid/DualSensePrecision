name: HidHide install check
on: workflow_dispatch
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download and extract HidHide's MSI
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/nefarius/HidHide/releases/download/v1.5.230.0/HidHide_1.5.230_x64.exe -OutFile hh.exe
          # The bootstrapper extracts the MSI to ProgramData before installing; start it, grab the MSI, stop it.
          $p = Start-Process .\hh.exe -ArgumentList '/exenoui','/exenoupdates','/qn','/norestart' -PassThru
          $msi = $null
          for ($i = 0; $i -lt 60 -and -not $msi; $i++) { Start-Sleep 1; $msi = Get-ChildItem 'C:\ProgramData\Nefarius Software Solutions' -Recurse -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1 }
          Start-Sleep 2
          Copy-Item $msi.FullName "$env:RUNNER_TEMP\HidHide.msi"
          "copied $($msi.FullName)"
          Get-ChildItem 'C:\ProgramData\Nefarius Software Solutions' -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
      - name: Dump MSI tables
        shell: powershell
        run: |
          $path = "$env:RUNNER_TEMP\HidHide.msi"
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($path, 0))
          function Q($sql) {
            $v = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
            [void]$v.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $v, $null)
            while ($true) {
              $r = $v.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $v, $null)
              if ($r -eq $null) { break }
              $n = $r.GetType().InvokeMember('FieldCount', 'GetProperty', $null, $r, $null)
              $vals = foreach ($i in 1..$n) { $r.GetType().InvokeMember('StringData', 'GetProperty', $null, $r, @($i)) }
              $vals -join ' | '
            }
          }
          "=== CustomAction"
          Q "SELECT Action, Type, Source, Target FROM CustomAction" | Where-Object { $_ -notmatch '^AI_' }
          "=== InstallExecuteSequence (non-standard)"
          Q "SELECT Action, Condition, Sequence FROM InstallExecuteSequence" | Where-Object { $_ -match 'Updater|Watchdog|Driver|Device|Class|Reboot|ETW' }
          "=== Property"
          Q "SELECT Property, Value FROM Property" | Where-Object { $_ -notmatch '^(AI_|ARP|Ai)' }
