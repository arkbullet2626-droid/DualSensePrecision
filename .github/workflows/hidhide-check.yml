name: HidHide install check
on: workflow_dispatch
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download and extract HidHide's MSI
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/nefarius/HidHide/releases/download/v1.5.230.0/HidHide_1.5.230_x64.exe -OutFile hh.exe
          $p = Start-Process .\hh.exe -ArgumentList '/extract',"`"$env:RUNNER_TEMP\x`"" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process $p -Force; "extract timed out" }
          Get-ChildItem "$env:RUNNER_TEMP\x" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
      - name: Dump updater-related MSI tables
        shell: pwsh
        run: |
          $msi = Get-ChildItem "$env:RUNNER_TEMP\x" -Recurse -Filter *.msi | Select-Object -First 1
          "MSI: $($msi.FullName)"
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$wi,@($msi.FullName,0))
          function Q($sql) {
            $v = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@($sql))
            $v.GetType().InvokeMember('Execute','InvokeMethod',$null,$v,$null)
            while ($r = $v.GetType().InvokeMember('Fetch','InvokeMethod',$null,$v,$null)) {
              $n = $r.GetType().InvokeProperty -eq $null
              $cols = $r.GetType().InvokeMember('FieldCount','GetProperty',$null,$r,$null)
              (1..$cols | ForEach-Object { $r.GetType().InvokeMember('StringData','GetProperty',$null,$r,@($_)) }) -join ' | '
            }
          }
          "=== CustomAction (updater / watchdog / AI_)"
          Q "SELECT Action, Type, Source, Target FROM CustomAction" | Where-Object { $_ -match 'pdat|Watchdog|vicius' }
          "=== InstallExecuteSequence for those"
          Q "SELECT Action, Condition, Sequence FROM InstallExecuteSequence" | Where-Object { $_ -match 'pdat|Watchdog|vicius' }
          "=== Properties"
          Q "SELECT Property, Value FROM Property" | Where-Object { $_ -match 'UPDAT|pdat|SILENT|UI' }
          "=== Feature"
          Q "SELECT Feature, Title, Level FROM Feature"
          "=== Condition"
          Q "SELECT Feature_, Level, Condition FROM Condition"
