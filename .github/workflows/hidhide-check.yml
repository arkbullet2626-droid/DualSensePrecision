name: HidHide install check
on: workflow_dispatch
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download HidHide
        shell: pwsh
        run: Invoke-WebRequest https://github.com/nefarius/HidHide/releases/download/v1.5.230.0/HidHide_1.5.230_x64.exe -OutFile hh.exe
      - name: Silent install, no update check, diagnose any wait
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\exe.log"
          $msilog = "$env:RUNNER_TEMP\msi.log"
          $args = @('/exenoui','/exenoupdates','/exelog',"`"$log`"",'/qn','/norestart','/L*v',"`"$msilog`"")
          "args: $args"
          $p = Start-Process .\hh.exe -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(150000)) {
            "STILL RUNNING after 150 s. Processes:"
            Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -gt (Get-Date).AddMinutes(-3) } | Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-Table -AutoSize -Wrap | Out-String -Width 400
            Get-Process | Where-Object MainWindowTitle | Select-Object Name, MainWindowTitle | Format-Table | Out-String -Width 300
          } else { "exit code: $($p.ExitCode)" }
          "service key: $(Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Services\HidHide')"
          "--- exe log"; if (Test-Path $log) { Get-Content $log -Tail 60 } else { "(none)" }
          "--- msi log errors"; if (Test-Path $msilog) { Select-String -Path $msilog -Pattern 'Return value 3|error|Error 1|MainEngineThread|Product:|Windows Installer installed|reboot' | Select-Object -Last 40 | ForEach-Object Line } else { "(none)" }
          "--- temp logs"; Get-ChildItem $env:TEMP -Filter *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 10 Name, Length
          "--- setupapi tail"; Get-Content C:\Windows\INF\setupapi.dev.log -Tail 40 -ErrorAction SilentlyContinue
          exit 0
