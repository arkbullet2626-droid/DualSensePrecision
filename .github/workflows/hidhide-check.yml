name: HidHide install check
on: workflow_dispatch
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Silent install; read the updater window; then close it
        shell: powershell
        run: |
          Invoke-WebRequest https://github.com/nefarius/HidHide/releases/download/v1.5.230.0/HidHide_1.5.230_x64.exe -OutFile hh.exe
          $p = Start-Process .\hh.exe -ArgumentList '/exenoui','/exenoupdates','/qn','/norestart' -PassThru
          $u = $null
          for ($i = 0; $i -lt 90 -and -not $u; $i++) { Start-Sleep 1; $u = Get-Process nefarius_HidHide_Updater -ErrorAction SilentlyContinue }
          "updater appeared after ~$i s"
          Start-Sleep 20
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          foreach ($proc in Get-Process nefarius_HidHide_Updater -ErrorAction SilentlyContinue) {
            $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $proc.Id)
            $wins = [System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $cond)
            foreach ($w in $wins) {
              "WINDOW: $($w.Current.Name)"
              foreach ($e in $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
                if ($e.Current.Name) { "  [$($e.Current.ControlType.ProgrammaticName)] $($e.Current.Name)" }
              }
            }
          }
          "updater cmdline: " + (Get-CimInstance Win32_Process -Filter "Name='nefarius_HidHide_Updater.exe'" | Select-Object -Expand CommandLine)
          "--- closing the dialog (WM_COMMAND IDCANCEL / IDCLOSE, like clicking Close)"
          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool PostMessage(System.IntPtr h, uint m, System.IntPtr w, System.IntPtr l);'
          foreach ($proc in Get-Process nefarius_HidHide_Updater -ErrorAction SilentlyContinue) {
            $h = $proc.MainWindowHandle
            "hwnd: $h"
            [void][W.U]::PostMessage($h, 0x0111, [IntPtr]2, [IntPtr]::Zero)
            Start-Sleep 3
            if (-not $proc.HasExited) { [void][W.U]::PostMessage($h, 0x0111, [IntPtr]8, [IntPtr]::Zero); Start-Sleep 3 }
            if (-not $proc.HasExited) { [void][W.U]::PostMessage($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero); Start-Sleep 3 }
            "updater exited: $($proc.HasExited)  exit code: $(if ($proc.HasExited) { $proc.ExitCode })"
          }
          Start-Sleep 10
          "updater still running: $([bool](Get-Process nefarius_HidHide_Updater -ErrorAction SilentlyContinue))"
          if (-not $p.WaitForExit(120000)) { "SETUP STILL RUNNING" } else { "setup exit code: $($p.ExitCode)" }
          "service key: $(Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Services\HidHide')"
          "program files: $(Test-Path 'C:\Program Files\Nefarius Software Solutions\HidHide')"
          "uninstall entry: " + [bool](Get-ChildItem HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -eq 'HidHide')
          sc.exe query HidHide
          "class filters (HIDClass): " + ((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{745a17a0-74d3-11d0-b6fe-00a0c90f57da}' -Name UpperFilters -ErrorAction SilentlyContinue).UpperFilters -join ',')
          exit 0
